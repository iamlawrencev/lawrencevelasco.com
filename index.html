  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--color-action-primary-bg)\">Work portfolio<\u002Fspan>\n<h2 style=\"font-size:var(--text-section-title-size);line-height:var(--text-section-title-lh);font-weight:var(--text-section-title-weight);letter-spacing:var(--text-section-title-tracking);margin:10px 0 12px;color:var(--color-text-primary)\">Selected professional work<\u002Fh2>\n<p style=\"margin:0;color:var(--color-text-secondary);font-size:1.05rem;max-width:var(--content-measure)\">Systems, automation, and business tools built across web, mobile, ERP, audit, and reporting workflows. Presented as anonymous case studies, without naming the employer.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px\">\n<sc-for list=\"{{ workTags }}\" as=\"tag\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ tag.select }}\" style=\"height:36px;padding:0 16px;border-radius:var(--radius-pill);font-size:0.85rem;font-weight:600;cursor:pointer;background:{{ tag.bg }};color:{{ tag.fg }};border:1px solid {{ tag.border }}\">{{ tag.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n<sc-for list=\"{{ workItems }}\" as=\"w\" hint-placeholder-count=\"6\">\n<div style=\"background:var(--color-bg-surface-secondary);border-radius:var(--radius-md);padding:24px;display:flex;flex-direction:column;gap:14px;transition:box-shadow var(--duration-fast) var(--ease-standard)\" style-hover=\"box-shadow:var(--shadow-float-sm)\">\n<div style=\"font-size:1.05rem;font-weight:700;color:var(--color-text-primary)\">{{ w.title }}<\u002Fdiv>\n<p style=\"margin:0;color:var(--color-text-secondary);font-size:0.92rem;line-height:1.55\">{{ w.description }}<\u002Fp>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:auto\">\n<sc-for list=\"{{ w.tech }}\" as=\"t\" hint-placeholder-count=\"3\">\n<span style=\"display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-pill);font-size:var(--text-meta-size);font-weight:600;background:var(--color-bg-surface);color:var(--color-text-secondary)\">{{ t }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" style=\"max-width:1100px;margin:0 auto;padding:var(--space-8) var(--space-8);scroll-margin-top:90px\">\n<div style=\"margin-bottom:var(--space-8)\">\n<span style=\"font-size:var(--text-label-size);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--color-action-primary-bg)\">About<\u002Fspan>\n<h2 style=\"font-size:var(--text-section-title-size);line-height:var(--text-section-title-lh);font-weight:var(--text-section-title-weight);letter-spacing:var(--text-section-title-tracking);margin:10px 0 12px;color:var(--color-text-primary)\">A problem solver, not just a builder.<\u002Fh2>\n<p style=\"margin:0;color:var(--color-text-secondary);font-size:1.05rem;max-width:70ch\">I started as a developer, then became a manager while still writing code myself — so I've seen delivery from both ends. That's the gap that trips up a lot of freelance work: it's easy to write code or run a project, harder to do both well. My background spans React Native, .NET MAUI, Xamarin, native mobile, the .NET ecosystem, and increasingly AI-driven builds — applied with the business context to make sure they solve the right problem, not just a technical one.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;margin-bottom:36px\">\n<div style=\"padding:28px;border-radius:var(--radius-md);background:var(--color-bg-surface-secondary)\">\n<div style=\"font-weight:700;font-size:1.05rem;margin-bottom:10px;color:var(--color-text-primary)\">Technical depth<\u002Fdiv>\n<p style=\"margin:0;color:var(--color-text-secondary);font-size:0.95rem;line-height:1.6\">I get into architecture, platform constraints, performance, and implementation detail — including applying AI where it actually earns its place, not just where it's easy to bolt on.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:28px;border-radius:var(--radius-md);background:var(--color-bg-surface-secondary)\">\n<div style=\"font-weight:700;font-size:1.05rem;margin-bottom:10px;color:var(--color-text-primary)\">Business context<\u002Fdiv>\n<p style=\"margin:0;color:var(--color-text-secondary);font-size:0.95rem;line-height:1.6\">Having managed delivery myself, I build toward your intent and outcomes, not just a spec — the difference between a solution that works and one that just ships.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-bottom:36px\">\n<div style=\"font-weight:700;font-size:1.05rem;margin-bottom:16px;color:var(--color-text-primary)\">Skills<\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n<sc-for list=\"{{ skills }}\" as=\"s\" hint-placeholder-count=\"17\">\n<span style=\"display:inline-flex;align-items:center;padding:6px 14px;border-radius:var(--radius-pill);font-size:0.85rem;font-weight:500;background:var(--color-bg-surface-secondary);color:var(--color-text-secondary);border:1px solid var(--color-border-hairline)\">{{ s }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-bottom:36px\">\n<div style=\"font-weight:700;font-size:1.05rem;margin-bottom:16px;color:var(--color-text-primary)\">Certifications<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0\">\n<sc-for list=\"{{ certifications }}\" as=\"c\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--color-border-hairline);gap:16px;flex-wrap:wrap\">\n<span style=\"font-size:0.95rem;color:var(--color-text-primary);font-weight:500\">{{ c.name }}<\u002Fspan>\n<span style=\"font-size:var(--text-meta-size);color:var(--color-text-tertiary)\">{{ c.date }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<  recognition into a focused score-chasing exercise.',\n      role: 'Mobile developer', platforms: 'iOS / Android',\n      outcome: 'React Native refresh for a focused education and music utility',\n      tech: ['React Native', 'TypeScript'],\n      links: [{ label: 'App Store', url: 'https://apps.apple.com/us/app/pitchie/id1506482999' }, { label: 'Google Play', url: 'https://play.google.com/store/apps/details?id=com.iamlawrencev.pitchie' }] }\n  ];\n\n  workData = [\n    { title: 'Web ERP and mobile point-of-sale system', tags: ['Web Systems', 'Mobile', 'ERP / HRIS'], tech: ['Xamarin.Forms', 'C#', 'Angular 4', 'TypeScript'],\n      description: 'A web-based ERP system that consolidated transactions from various branches of a company in the food industry, bundled with a mobile point-of-sale system for transaction input.' },\n    { title: 'Automated report creator and consolidator', tags: ['Automation', 'ERP / HRIS'], tech: ['VBA Macro', 'Microsoft Excel'],\n      description: 'Automated reports generated from SAP and other ERP systems, formatting them for manual user access reviews.' },\n    { title: 'User access review', tags: ['Audit', 'Security'], tech: ['Microsoft Excel'],\n      description: 'Reviewed user access based on appropriateness and segregation of duties.' },\n    { title: 'ERP and HRIS update', tags: ['ERP / HRIS', 'Web Systems'], tech: ['VB6', 'MSSQL'],\n      description: 'Fixed existing bugs and added new features to an ERP system and HRIS.' },\n    { title: 'Database and operating system audit', tags: ['Audit', 'Security', 'Databases'], tech: ['Oracle Database', 'MSSQL', 'Windows Server', 'Oracle Enterprise Linux', 'Red Hat Enterprise Linux', 'IBM AIX'],\n      description: 'Audited databases and operating systems in accordance with BSP Circular 808.' },\n    { title: 'Source code review and vulnerability assessment', tags: ['Security', 'Audit', 'Databases'], tech: ['PowerBuilder', 'MSSQL'],\n      description: 'Reviewed a banking system for vulnerabilities and programming issues in accordance with BSP Circular 808.' }\n  ];\n\n  workTagsData = ['All', 'Web Systems', 'Mobile', 'Automation', 'ERP / HRIS', 'Audit', 'Security', 'Databases'];\n\n  skillsData = ['React Native', '.NET MAUI', 'Xamarin', 'Native Android', 'Native iOS', '.NET', 'TypeScript', 'C#', 'Supabase', 'Angular', 'VB6', 'MSSQL', 'Oracle Database', 'Microsoft Excel / VBA', 'PowerBuilder', 'Windows Server', 'Linux / IBM AIX'];\n\n  certificationsData = [\n    { name: 'Xamarin Certified Mobile Developer', date: 'Jan 2019' },\n    { name: 'Xamarin Certified Mobile Professional', date: 'Jan 2019' }\n  ];\n\n  timelineData = [\n    { role: 'Associate', range: 'Aug 2016 – Aug 2018' },\n    { role: 'Mobile Application Developer', range: 'Aug 2018 – Aug 2020' },\n    { role: 'Senior Mobile Application Developer', range: 'Aug 2020 – Nov 2021' },\n    { role: 'Lead Senior App Developer', range: 'Nov 2021 – Jun 2025' },\n    { role: 'Project Coordinator', range: 'Jun 2025 – Present' }\n  ];\n\n  sectionIds = ['home', 'personal-projects', 'work-portfolio', 'about', 'contact'];\n\n  componentDidMount() {\n    document.documentElement.setAttribute('data-theme', 'dark');\n\n    this.onScroll = () => {\n      if (this.scrollScheduled) return;\n      this.scrollScheduled = true;\n      requestAnimationFrame(() => {\n        this.scrollScheduled = false;\n        this.updateActiveSection();\n      });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.updateActiveSection();\n\n    this.mq = window.matchMedia('(max-width: 760px)');\n    this.onMqChange = (e) => this.setState({ isMobile: e.matches, mobileMenuOpen: false });\n    this.onMqChange(this.mq);\n    this.mq.addEventListener('change', this.onMqChange);\n  }\n\n  componentWillUnmount() {\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n    if (this.timelineEl) this.timelineEl.removeEventListener('scroll', this.updateFades);\n    if (this.mq) this.mq.removeEventListener('change', this.onMqChange);\n    clearTimeout(this.navSyncTimer);\n  }\n\n  toggleMobileMenu = () => this.setState((s) => ({ mobileMenuOpen: !s.mobileMenuOpen }));\n\n  updateActiveSection = () => {\n    if (this.suppressScrollSync) return;\n    const doc = document.documentElement;\n    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 2) {\n      this.setState({ activeSection: 'contact' });\n      return;\n    }\n    const offset = 130;\n    let current = this.sectionIds[0];\n    for (const id of this.sectionIds) {\n      const el = document.getElementById(id);\n      if (!el) continue;\n      if (el.getBoundingClientRect().top <= offset) current = id;\n    }\n    this.setState({ activeSection: current });\n  };\n\n  setWorkFilter = (tag) => this.setState({ workFilter: tag });\n  selectTimeline = (i) => this.setState({ timelineIndex: i });\n\n  navTo = (id) => {\n    clearTimeout(this.navSyncTimer);\n    this.suppressScrollSync = true;\n    this.setState({ activeSection: id });\n    this.navSyncTimer = setTimeout(() => {\n      this.suppressScrollSync = false;\n      this.updateActiveSection();\n    }, 900);\n  };\n  navToPersonal = () => this.navTo('personal-projects');\n  navToWork = () => this.navTo('work-portfolio');\n  navToAbout = () => this.navTo('about');\n  navToContact = () => this.navTo('contact');\n\n  mobileNavTo = (id) => { this.setState({ mobileMenuOpen: false }); this.navTo(id); };\n  mobileNavToPersonal = () => this.mobileNavTo('personal-projects');\n  mobileNavToWork = () => this.mobileNavTo('work-portfolio');\n  mobileNavToAbout = () => this.mobileNavTo('about');\n\n  updateFades = () => {\n    const el = this.timelineEl;\n    if (!el || !this.leftFadeEl || !this.rightFadeEl) return;\n    this.leftFadeEl.style.opacity = el.scrollLeft > 4 ? '1' : '0';\n    this.rightFadeEl.style.opacity = el.scrollLeft < el.scrollWidth - el.clientWidth - 4 ? '1' : '0';\n  };\n\n  setTimelineRef = (el) => {\n    if (!el || this.timelineEl === el) return;\n    this.timelineEl = el;\n    el.scrollLeft = el.scrollWidth;\n    this.updateFades();\n    el.addEventListener('scroll', this.updateFades, { passive: true });\n  };\n\n  setLeftFadeRef = (el) => { this.leftFadeEl = el; this.updateFades(); };\n  setRightFadeRef = (el) => { this.rightFadeEl = el; this.updateFades(); };\n\n  renderVals() {\n    const active = this.state.activeSection;\n    const navStyle = (key) => ({\n      weight: active === key ? 700 : 500,\n      color: active === key ? 'var(--color-text-primary)' : 'var(--color-text-secondary)'\n    });\n    const p = navStyle('personal-projects'), w = navStyle('work-portfolio'), a = navStyle('about'), c = navStyle('contact');\n\n    const workTags = this.workTagsData.map((label) => {\n      const isActive = label === this.state.workFilter;\n      return {\n        label,\n        select: () => this.setWorkFilter(label),\n        bg: isActive ? 'var(--color-selection-bg)' : 'var(--color-bg-surface-secondary)',\n        fg: isActive ? 'var(--color-selection-fg)' : 'var(--color-text-secondary)',\n        border: isActive ? 'var(--color-selection-border)' : 'var(--color-border-hairline)'\n      };\n    });\n\n    const workItems = this.workData.filter((w2) => this.state.workFilter === 'All' || w2.tags.includes(this.state.workFilter));\n\n    const timeline = this.timelineData.map((t, i) => {\n      const sel = i === this.state.timelineIndex;\n      return {\n        role: t.role, range: t.range, select: () => this.selectTimeline(i),\n        bg: sel ? 'var(--color-selection-bg)' : 'var(--color-bg-surface-secondary)',\n        fg: sel ? 'var(--color-selection-fg)' : 'var(--color-text-primary)',\n        border: sel ? 'var(--color-selection-border)' : 'var(--color-border-hairline)'\n      };\n    });\n\n    return {\n      timelineRef: this.setTimelineRef,\n      leftFadeRef: this.setLeftFadeRef, rightFadeRef: this.setRightFadeRef,\n      navToPersonal: this.navToPersonal, navToWork: this.navToWork, navToAbout: this.navToAbout, navToContact: this.navToContact,\n      mobileNavToPersonal: this.mobileNavToPersonal, mobileNavToWork: this.mobileNavToWork, mobileNavToAbout: this.mobileNavToAbout,\n      isMobile: this.state.isMobile, isDesktop: !this.state.isMobile,\n      mobileMenuOpen: this.state.mobileMenuOpen, mobileMenuClosed: !this.state.mobileMenuOpen,\n      toggleMobileMenu: this.toggleMobileMenu,\n      mobileMenuRows: this.state.mobileMenuOpen ? '1fr' : '0fr',\n      navPersonalWeight: p.weight, navPersonalColor: p.color,\n      navWorkWeight: w.weight, navWorkColor: w.color,\n      navAboutWeight: a.weight, navAboutColor: a.color,\n      navContactWeight: c.weight, navContactColor: c.color,\n      projects: this.projectsData,\n      workTags, workItems,\n      skills: this.skillsData,\n      certifications: this.certificationsData,\n      timeline\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
